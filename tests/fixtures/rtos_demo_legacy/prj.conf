# Normal demonstration: two threads, timer ISR, text and CTF RAM events.
CONFIG_DEBUG_INFO=y
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_THREAD_NAME=y
CONFIG_MAIN_STACK_SIZE=1536

CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1024

CONFIG_TRACING=y
CONFIG_TRACING_CTF=y
CONFIG_TRACING_BACKEND_RAM=y
CONFIG_TRACING_SYNC=y
CONFIG_RAM_TRACING_BUFFER_SIZE=4096

# The exact board must provide a console backend. See README if no text appears.
# Fault tests remain disabled in src/demo_config.h.
