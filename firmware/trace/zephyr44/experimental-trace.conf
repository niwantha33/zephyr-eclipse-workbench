# SPDX-License-Identifier: Apache-2.0
# EXPERIMENTAL, opt-in only for a separately patched pristine pinned Zephyr.
# Do NOT apply to an ordinary Zephyr 4.4.0 checkout or the Workbench UI.
# Use only with a verified SEGGER RTT supported board/probe; no generic RTT.
CONFIG_TRACING=y
CONFIG_TRACING_CTF=y
CONFIG_TRACING_CTF_TIMESTAMP=y
CONFIG_TRACING_ASYNC=y
CONFIG_TRACING_BACKEND_ZEW_RTT=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_MAX_NUM_UP_BUFFERS=3
CONFIG_TRACING_BUFFER_SIZE=8192
CONFIG_TRACING_THREAD_STACK_SIZE=2048
CONFIG_ZEW_TRACE_RTT_UP_BYTES=8192
CONFIG_THREAD_NAME=y

# REQUIRED evidence inputs. Empty by default: the firmware backend refuses to
# initialise. Replace with exact 64 lowercase hex SHA256 values of verified
# prebuild image contract and exact CTF metadata. These are NOT flashed-ELF
# proof; the real hardware/live UI gates stay closed.
CONFIG_ZEW_TRACE_IMAGE_CONTRACT_SHA256=""
CONFIG_ZEW_TRACE_METADATA_SHA256=""
