# SPDX-License-Identifier: Apache-2.0
# MSPM0G3507 FIRST, but vendor-neutral. Requires isolated patched Zephyr 4.4.
# Finite halted-debug RAM snapshot, NOT a live RTT stream and no probe access.
CONFIG_TRACING=y
CONFIG_TRACING_CTF=y
CONFIG_TRACING_CTF_TIMESTAMP=y
CONFIG_TRACING_ASYNC=y
CONFIG_TRACING_BACKEND_ZEW_RAM=y
CONFIG_TRACING_BUFFER_SIZE=2048
CONFIG_TRACING_THREAD_STACK_SIZE=2048
CONFIG_TRACING_THREAD_WAIT_THRESHOLD=10
CONFIG_ZEW_TRACE_RAM_BYTES=4096
CONFIG_THREAD_NAME=y

# Required, exact 64-char lowercase SHA256 values of PREBUILD input contract
# and pinned CTF TSDL metadata. Deliberately empty = backend refuses start.
# CI generates both automatically for isolated build probes. Never infer from
# source name or substitute a final ELF digest for the prebuild contract.
CONFIG_ZEW_TRACE_IMAGE_CONTRACT_SHA256=""
CONFIG_ZEW_TRACE_METADATA_SHA256=""

# TEST / CI ONLY. MSPM0 has no verified hardware entropy in this matrix.
# A timer-based marker is NOT random/unique enough for live qualification.
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_TIMER_RANDOM_GENERATOR=y
