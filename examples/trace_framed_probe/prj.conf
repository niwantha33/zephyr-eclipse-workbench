# SPDX-License-Identifier: Apache-2.0
# Build probe only, compiled against explicit pinned Zephyr 4.4 backend.
# The CI build script supplies which ONE of ZEW_RAM / ZEW_RTT is enabled,
# plus exact prebuild contract hashes. NEVER silently default to RTT.
CONFIG_TRACING=y
CONFIG_TRACING_CTF=y
CONFIG_TRACING_CTF_TIMESTAMP=y
CONFIG_TRACING_ASYNC=y
CONFIG_THREAD_NAME=y
CONFIG_TRACING_BUFFER_SIZE=2048
CONFIG_TRACING_THREAD_STACK_SIZE=1024
CONFIG_TRACING_THREAD_WAIT_THRESHOLD=10
CONFIG_MAIN_STACK_SIZE=1024
