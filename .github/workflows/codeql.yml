# SPDX-License-Identifier: Apache-2.0
name: CodeQL Java security analysis

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '21 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql-java:
    name: CodeQL (Java)
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 21 and cache Maven dependencies
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6 pinned
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Source-only extraction missed Tycho's Eclipse/p2 classpath and could
      # not resolve the pinned extension when Maven Central returned HTTP 429.
      # Trace the same fail-closed Tycho build used by the package workflow
      # so CodeQL observes the actual compiled Java and resolved dependencies.
      - name: Initialize CodeQL for Java
        id: init
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
      - name: Compile Eclipse plug-ins for CodeQL
        shell: bash
        run: |
          set -euo pipefail
          qualifier="$(date -u +%Y%m%d%H%M%S)"
          python3 scripts/retry_maven_tycho.py --qualifier "$qualifier"
      - name: Analyse Java source
        id: analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:java-kotlin
      - name: Verify upstream CodeQL database quality telemetry
        env:
          CODEQL_CLI: ${{ steps.init.outputs.codeql-path }}
          CODEQL_DATABASE: ${{ fromJSON(steps.analysis.outputs.db-locations).java }}
        run: python3 scripts/ci_evidence.py codeql
