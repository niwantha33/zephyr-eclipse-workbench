# SPDX-License-Identifier: Apache-2.0
name: CodeQL Java security analysis

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '21 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql-java:
    name: CodeQL (Java)
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 21 and cache Maven dependencies
        uses: actions/setup-java@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Source-only extraction missed Tycho's Eclipse/p2 classpath and could
      # not resolve the pinned extension when Maven Central returned HTTP 429.
      # Trace the same fail-closed Tycho build used by the package workflow
      # so CodeQL observes the actual compiled Java and resolved dependencies.
      - name: Initialize CodeQL for Java
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4 pinned
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
      - name: Compile Eclipse plug-ins for CodeQL
        shell: bash
        run: |
          set -euo pipefail
          qualifier="$(date -u +%Y%m%d%H%M%S)"
          python3 scripts/retry_maven_tycho.py --qualifier "$qualifier"
      - name: Analyse Java source
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4 pinned
        with:
          category: /language:java-kotlin
