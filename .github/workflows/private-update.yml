# SPDX-License-Identifier: Apache-2.0
# Standard GitHub-hosted Linux runners are free on PUBLIC repositories.
# Keep the verified one-job publish; no intermediate Actions artifacts.
# Do not use on a private repository with exhausted Actions minutes.
name: Build and publish Zephyr Workbench p2 update
on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'features/**'
      - 'releng/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pom.xml'
      - '.github/workflows/private-update.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-zephyr-updates-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build_and_publish:
    name: Verify and publish on public GitHub-hosted runner
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out exact merged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Validate local Java 21, Python, Maven and Git
        run: |
          set -euo pipefail
          command -v java
          command -v javac
          command -v python3
          command -v mvn
          command -v git
          test -d "${JAVA_HOME_21_X64:-}"
          export JAVA_HOME="$JAVA_HOME_21_X64"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME/bin/java" -version
          "$JAVA_HOME/bin/java" -version 2>&1 | grep -Eq 'version "21(\.|")'
          python3 -c 'import sys; assert sys.version_info >= (3, 10), sys.version'
          mvn -version
          mvn -version | python3 -c 'import re,sys; s=sys.stdin.read(); m=re.search(r"Apache Maven (\d+)\.(\d+)\.", s); assert m and tuple(map(int,m.groups())) >= (3,9), s'
      - name: Install pinned test metadata dependencies
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3 west==1.5.0
      - name: Run all core and Python dependency regression tests
        run: python3 scripts/test_core.py
      # Tycho's plain qualifier can be identical on different main commits
      # (previously 198002010000). Choose a monotonically increasing qualifier
      # from the immutable update channel, then force it for the whole reactor.
      # The publish job is serialized by the workflow concurrency group.
      - name: Derive strictly newer p2 qualifier
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/updates:refs/remotes/origin/updates
          git show refs/remotes/origin/updates:channel.properties > "$RUNNER_TEMP/current-channel.properties"
          python3 - <<'PY'
          import datetime
          import os
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = ET.parse("pom.xml").getroot()
          maven_version = root.find("{http://maven.apache.org/POM/4.0.0}version").text
          if not re.fullmatch(r"\d+\.\d+\.\d+-SNAPSHOT", maven_version or ""):
              raise SystemExit("Source project must declare a numeric SNAPSHOT version")
          base = maven_version.removesuffix("-SNAPSHOT")
          source = tuple(map(int, base.split(".")))
          channel = Path(os.environ["RUNNER_TEMP"], "current-channel.properties").read_text(encoding="utf-8")
          match = re.search(r"(?m)^version=(\d+\.\d+\.\d+\.\d{8,14})$", channel)
          if not match:
              raise SystemExit("Update channel is missing a valid numeric version")
          previous = match.group(1)
          published = tuple(map(int, previous.split(".")))
          if source < published[:3]:
              raise SystemExit(f"Source {base} is older than published {previous}; refusing downgrade")
          stamp = int(datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%d%H%M%S"))
          qualifier = max(stamp, published[3] + 1) if source == published[:3] else stamp
          if not re.fullmatch(r"\d{8,14}", str(qualifier)):
              raise SystemExit("Monotonic build qualifier exceeds supported width")
          target = f"{base}.{qualifier}"
          if tuple(map(int, target.split("."))) <= published:
              raise SystemExit("Computed version would not advance the update channel")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"ZEW_RELEASE_QUALIFIER={qualifier}\n")
              env.write(f"ZEW_RELEASE_VERSION={target}\n")
          print(f"Publishing candidate {target} (current channel: {previous})")
          PY
      - name: Build clean Tycho p2 update site
        run: mvn --batch-mode --no-transfer-progress "-DforceContextQualifier=${ZEW_RELEASE_QUALIFIER}" clean verify
      - name: Verify packaged p2 site before publication
        run: python3 scripts/verify_site.py
      - name: Exercise native Eclipse import, export and CDT configuration selection
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zew-eclipse"
          curl --fail --location --retry 3 \
            https://download.eclipse.org/eclipse/downloads/drops4/R-4.41-202608281142/eclipse-platform-4.41-linux-gtk-x86_64.tar.gz \
            -o "$RUNNER_TEMP/eclipse-platform.tar.gz"
          tar -xzf "$RUNNER_TEMP/eclipse-platform.tar.gz" -C "$RUNNER_TEMP/zew-eclipse"
          ECLIPSE="$RUNNER_TEMP/zew-eclipse/eclipse"
          LAUNCHERS=("$ECLIPSE"/plugins/org.eclipse.equinox.launcher_*.jar)
          java -jar "${LAUNCHERS[0]}" -nosplash -application org.eclipse.equinox.p2.director \
            -destination "$ECLIPSE" -profile SDKProfile -roaming \
            -repository https://download.eclipse.org/eclipse/updates/4.41/R-4.41-202608281142/,https://download.eclipse.org/tools/cdt/releases/12.6/cdt-12.6.0/,https://download.eclipse.org/releases/2026-09/202609091000/ \
            -installIU org.eclipse.cdt.core,org.eclipse.cdt.ui,org.eclipse.cdt.debug.core,org.eclipse.cdt.dsf.gdb,org.eclipse.cdt.dsf.gdb.ui,org.eclipse.cdt.cmake.ui,org.eclipse.cdt.build.gcc.core
          xvfb-run -a python3 scripts/editor_smoke.py --native-workbench \
            --eclipse "$ECLIPSE" --java-home "$JAVA_HOME" --site releng/repository/target/repository
      - name: Publish release and channel as one fast-forward operation
        shell: bash
        run: |
          set -euo pipefail
          SITE="$GITHUB_WORKSPACE/releng/repository/target/repository"
          VERSION="$(python3 - <<'PY'
          import re, zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path
          jars = list(Path('releng/repository/target/repository/features').glob('*.jar'))
          if len(jars) != 1:
              raise SystemExit('Expected one installable feature')
          with zipfile.ZipFile(jars[0]) as archive:
              feature = ET.fromstring(archive.read('feature.xml'))
          version = feature.attrib['version']
          pom = ET.parse('pom.xml').getroot()
          base = pom.find('{http://maven.apache.org/POM/4.0.0}version').text
          if not base or not re.fullmatch(r'\d+\.\d+\.\d+-SNAPSHOT', base):
              raise SystemExit('Project has no valid version')
          base = base.removesuffix('-SNAPSHOT')
          if feature.attrib.get('id') != 'io.github.niwantha33.zew.feature' or not re.fullmatch(re.escape(base)+r'\.[0-9]{8,14}', version):
              raise SystemExit('Expected a matching timestamp-qualified development preview')
          print(version)
          PY
          )"
          if [ "$VERSION" != "$ZEW_RELEASE_VERSION" ]; then
            echo "Built feature version $VERSION does not match reserved $ZEW_RELEASE_VERSION" >&2
            exit 1
          fi
          # A PR merge is only valid if this job is still publishing the tip of
          # main. Never publish an older completed build over a newer commit.
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA" || {
            echo "Main advanced since this build; a newer workflow will publish it."
            exit 1
          }
          git fetch --no-tags origin refs/heads/updates:refs/remotes/origin/updates
          RELEASE_ROOT="$RUNNER_TEMP/zephyr-p2-updates"
          git worktree prune
          git worktree add --detach "$RELEASE_ROOT" refs/remotes/origin/updates
          trap 'git worktree remove --force "$RELEASE_ROOT" >/dev/null 2>&1 || true' EXIT
          export RELEASE_ROOT VERSION

          python3 - <<'PY'
          import os, re
          from pathlib import Path
          root = Path(os.environ['RELEASE_ROOT'])
          current = next((line.partition('=')[2] for line in (root/'channel.properties').read_text().splitlines()
                          if line.startswith('version=')), '')
          version = os.environ['VERSION']
          if not re.fullmatch(r'\d+\.\d+\.\d+\.\d+', current):
              raise SystemExit('Current channel is invalid')
          if tuple(map(int, version.split('.'))) <= tuple(map(int, current.split('.'))):
              raise SystemExit('Refusing downgrade or same-version replacement')
          if (root/'releases'/version).exists():
              raise SystemExit('Immutable release directory already exists')
          PY

          mkdir "$RELEASE_ROOT/releases/$VERSION"
          cp -a "$SITE/." "$RELEASE_ROOT/releases/$VERSION/"
          git -C "$RELEASE_ROOT" add -- "releases/$VERSION"
          git -C "$RELEASE_ROOT" -c user.name=zephyr-p2-ci \
            -c user.email=zephyr-p2-ci@users.noreply.github.com \
            commit -m "updates: stage immutable p2 release $VERSION"
          IMMUTABLE_SHA="$(git -C "$RELEASE_ROOT" rev-parse HEAD)"
          python3 scripts/prepare_update.py \
            --site "$SITE" --revision "$IMMUTABLE_SHA" \
            --output "$RUNNER_TEMP/prepared-release" \
            --notes "Development preview: cross-vendor board dependencies, project properties and native run configurations. Windows hardware and desktop validation pending."
          cp "$RUNNER_TEMP/prepared-release/channel.properties" "$RELEASE_ROOT/channel.properties"

          python3 - <<'PY'
          import os, hashlib
          from pathlib import Path
          root = Path(os.environ['RELEASE_ROOT'])
          rows = dict(line.split('=',1) for line in (root/'channel.properties').read_text().splitlines() if '=' in line)
          if rows['version'] != os.environ['VERSION'] or rows['directory'] != 'releases/'+rows['version']:
              raise SystemExit('Incorrect channel version or release directory')
          if not 3 <= int(rows['files']) <= 100:
              raise SystemExit('Invalid number of release files')
          for i in range(int(rows['files'])):
              name = rows[f'file.{i}.path']
              data = (root/rows['directory']/name).read_bytes()
              if len(data) != int(rows[f'file.{i}.size']) or hashlib.sha256(data).hexdigest() != rows[f'file.{i}.sha256']:
                  raise SystemExit('Checksum mismatch: '+name)
          print('Verified all versioned files before publishing.')
          PY

          git -C "$RELEASE_ROOT" add -- channel.properties
          git -C "$RELEASE_ROOT" -c user.name=zephyr-p2-ci \
            -c user.email=zephyr-p2-ci@users.noreply.github.com \
            commit -m "updates: activate $VERSION"
          git -C "$RELEASE_ROOT" push origin HEAD:updates
          echo "Published private $VERSION with previous releases retained." >> "$GITHUB_STEP_SUMMARY"

