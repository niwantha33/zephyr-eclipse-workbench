# SPDX-License-Identifier: Apache-2.0
name: Build development update site
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workbench-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select runner's open-source JDK 21
        shell: bash
        run: |
          test -d "$JAVA_HOME_21_X64"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - name: Exercise process and command core
        run: python3 scripts/test_core.py
      - name: Build plug-ins and p2 repository
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Verify packaged site
        run: python3 scripts/verify_site.py
      - name: Retain private development update site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zephyr-eclipse-workbench-development-site
          path: releng/repository/target/repository/
          if-no-files-found: error
          retention-days: 7
