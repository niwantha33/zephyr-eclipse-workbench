# SPDX-License-Identifier: Apache-2.0
name: Build development update site
on:
  workflow_dispatch:
  # Run on every PR, including documentation-only changes: a required check
  # must not remain pending or be bypassed by workflow path filters.
  pull_request:
permissions:
  contents: read
concurrency:
  group: workbench-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Python 3.9 is no longer in the ubuntu-24.04 tool cache. setup-python
  # fetched its release from GitHub twice and hit repeated 504 gateway errors.
  # Test real CPython 3.9 without that GitHub release download, from a
  # pinned, multi-platform Docker Official Image index.
  evidence-pytest39:
    name: Evidence CLI pytest (Python 3.9)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: python:3.9.25-slim-bookworm@sha256:a02e9c5406c416c504d6c9a1a306ff4080c3173f1008d192f953bd20382a2d5c
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Confirm CPython version
        run: python -c "import sys; assert sys.version_info[:2] == (3, 9), sys.version"
      - name: Install Evidence CLI package and pytest
        run: python -m pip install --disable-pip-version-check -e . pytest==8.4.2
      - name: Run synthetic Evidence CLI regression tests
        run: |
          python -m pytest -q tests/pytest/test_evidence_cli.py
          zew --version
          python zew.py --version

  evidence-pytest:
    name: Evidence CLI pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up matrix Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Evidence CLI package and pytest
        run: python -m pip install --disable-pip-version-check -e . pytest==8.4.2
      - name: Run synthetic Evidence CLI regression tests
        run: |
          python -m pytest -q tests/pytest/test_evidence_cli.py
          zew --version
          python zew.py --version

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select runner's open-source JDK 21
        shell: bash
        run: |
          test -d "$JAVA_HOME_21_X64"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - name: Install pinned test metadata dependencies
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3 west==1.5.0 kconfiglib==14.1.0 jsonschema==4.25.1
      - name: Exercise process and command core
        run: python3 scripts/test_core.py
      - name: Verify live CTF remains an unsupported UI stub
        run: python3 scripts/test_live_trace_stub.py
      - name: Install LLVM lld for genuine host-format validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lld
          command -v ld.lld
      - name: Inspect genuine GNU and LLVM host linker outputs
        run: python3 scripts/evidence_native_linker_smoke.py
      - name: Package deterministic offline CLI
        run: |
          mkdir -p build-cli
          python3 scripts/package_cli.py --output build-cli/zew-0.1.1.pyz > build-cli/SHA256SUMS
          python3 build-cli/zew-0.1.1.pyz --version
      - name: Retain Phase-0 CLI distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: zew-evidence-cli-prototype
          path: build-cli/
          if-no-files-found: error
          retention-days: 7
      - name: Build plug-ins and p2 repository
        # Use a current UTC qualifier so a reviewed PR artifact can update an
        # existing preview installation. This does not publish the update channel.
        run: |
          zew_test_qualifier="$(date -u +%Y%m%d%H%M%S)"
          mvn --batch-mode --no-transfer-progress "-DforceContextQualifier=${zew_test_qualifier}" verify
      - name: Verify packaged site
        run: python3 scripts/verify_site.py
      - name: Compile and exercise installed native Eclipse UI before merge
        env:
          ZEW_SCREENSHOT_DIR: ${{ github.workspace }}/release-smoke-screenshots
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gdb gdbserver
          mkdir -p "$RUNNER_TEMP/zew-eclipse"
          curl --fail --location --retry 3 \
            https://download.eclipse.org/eclipse/downloads/drops4/R-4.41-202608281142/eclipse-platform-4.41-linux-gtk-x86_64.tar.gz \
            -o "$RUNNER_TEMP/eclipse-platform.tar.gz"
          (cd "$RUNNER_TEMP" && sha512sum --check "$GITHUB_WORKSPACE/scripts/eclipse-platform-4.41-linux.sha512")
          tar -xzf "$RUNNER_TEMP/eclipse-platform.tar.gz" -C "$RUNNER_TEMP/zew-eclipse"
          ECLIPSE="$RUNNER_TEMP/zew-eclipse/eclipse"
          LAUNCHERS=("$ECLIPSE"/plugins/org.eclipse.equinox.launcher_*.jar)
          java -jar "${LAUNCHERS[0]}" -nosplash -application org.eclipse.equinox.p2.director \
            -destination "$ECLIPSE" -profile SDKProfile -roaming \
            -repository https://download.eclipse.org/eclipse/updates/4.41/R-4.41-202608281142/,https://download.eclipse.org/tools/cdt/releases/12.6/cdt-12.6.0/,https://download.eclipse.org/releases/2026-09/202609091000/ \
            -installIU org.eclipse.cdt.core,org.eclipse.cdt.ui,org.eclipse.cdt.debug.core,org.eclipse.cdt.dsf.gdb,org.eclipse.cdt.dsf.gdb.ui,org.eclipse.cdt.cmake.ui,org.eclipse.cdt.build.gcc.core
          xvfb-run -a python3 scripts/build_failure_smoke.py \
            --eclipse "$ECLIPSE" --java-home "$JAVA_HOME" --site releng/repository/target/repository
          xvfb-run -a python3 scripts/editor_smoke.py --native-workbench \
            --eclipse "$ECLIPSE" --java-home "$JAVA_HOME" --site releng/repository/target/repository
          # Repeat with the exact same screenshot-free environment as the main
          # publishing workflow. This caught a real UI failure invisible in PR CI.
          ZEW_SCREENSHOT_DIR= xvfb-run -a python3 scripts/editor_smoke.py --native-workbench \
            --eclipse "$ECLIPSE" --java-home "$JAVA_HOME" --site releng/repository/target/repository
      - name: Retain native Eclipse screenshots from the actual installed UI
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zephyr-native-ui-evidence
          path: release-smoke-screenshots/
          if-no-files-found: warn
          retention-days: 7
      - name: Retain private development update site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zephyr-eclipse-workbench-development-site
          path: releng/repository/target/repository/
          if-no-files-found: error
          retention-days: 7


  windows-firmware:
    name: Native Windows managed firmware matrix
    runs-on: windows-2025
    timeout-minutes: 100
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select runner JDK 21
        shell: pwsh
        run: |
          "JAVA_HOME=$env:JAVA_HOME_21_X64" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$env:JAVA_HOME_21_X64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Install pinned test-only metadata dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 west==1.5.0 kconfiglib==14.1.0 jsonschema==4.25.1
      - name: Run Windows unit and fault-injection tests
        run: python scripts/test_core.py
      - name: Fresh pinned managed environment
        env:
          ZEW_CI_SDK_ASSET_API: '1'
        run: python scripts/windows_firmware_matrix.py --root C:/zew-ci --setup-only
      - name: Cross-vendor managed firmware matrix including ADC diagnostic
        env:
          ZEW_CI_SDK_ASSET_API: '1'
        run: python scripts/windows_firmware_matrix.py --root C:/zew-ci --run-only
      - name: Qualify all seven real firmware evidence reports
        run: python scripts/qualify_firmware_matrix.py --input windows-firmware-results.json --output windows-firmware-qualification.json
      - name: Retain verified target results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-firmware-evidence
          path: |
            windows-firmware-results.json
            windows-firmware-qualification.json
          if-no-files-found: warn
          retention-days: 7

  # This is the *single* status to require in branch protection. It cannot
  # pass until native Eclipse, full 7-target Windows, and Python matrix jobs succeed.
  # Repository admins must configure it as a required check; this workflow
  # cannot change protected branch settings by itself.
  evidence-qualification-gate:
    name: Evidence qualification gate
    if: ${{ always() }}
    needs: [package, windows-firmware, evidence-pytest, evidence-pytest39]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require installed Eclipse smoke and all seven Windows firmware observations
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          WINDOWS_RESULT: ${{ needs.windows-firmware.result }}
          PYTEST_RESULT: ${{ needs.evidence-pytest.result }}
          PY39_RESULT: ${{ needs.evidence-pytest39.result }}
        run: |
          if [ "$PACKAGE_RESULT" != "success" ] || [ "$WINDOWS_RESULT" != "success" ] || [ "$PYTEST_RESULT" != "success" ] || [ "$PY39_RESULT" != "success" ]; then
            echo "Not qualified: Linux=$PACKAGE_RESULT, Windows=$WINDOWS_RESULT, Python matrix=$PYTEST_RESULT, Python 3.9=$PY39_RESULT" >&2
            exit 1
          fi
          echo "Packaging, Windows firmware, and Python matrix passed; no device or production approval is implied."
